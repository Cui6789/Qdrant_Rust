[package]
name = "kb-dashboard-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Yew/WASM frontend for the Qdrant_Rust visual dashboard."

[workspace]

[dependencies]
kb-dashboard-types = { path = "../kb-dashboard-types" }
yew = { version = "0.21", features = ["csr"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "SubmitEvent",
    "Window",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
