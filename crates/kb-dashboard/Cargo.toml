[package]
name = "kb-dashboard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Apple-style visual dashboard for the Qdrant_Rust knowledge base."

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
kb-core = { path = "../kb-core", default-features = false }
kb-dashboard-types = { path = "../kb-dashboard-types" }
qdrant-client = { version = "1.20.0", default-features = false, features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
