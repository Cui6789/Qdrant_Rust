[package]
name = "kb-dashboard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Reusable Axum workbench router for the Qdrant_Rust knowledge base."

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
kb-core = { path = "../kb-core", default-features = false }
kb-dashboard-types = { path = "../kb-dashboard-types" }
qdrant-client = { version = "1.20.0", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "timeout", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
